<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GH-300 Unified Deep Dive - Print View</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.45;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      margin: 0;
    }

    .toolbar {
      align-items: center;
      background: #111827;
      color: #ffffff;
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .toolbar button {
      background: #ffffff;
      border: 0;
      border-radius: 0.25rem;
      color: #111827;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0.5rem 0.8rem;
    }

    .toolbar a {
      color: #ffffff;
    }

    main {
      background: #ffffff;
      box-sizing: border-box;
      margin: 2rem auto;
      max-width: 8.5in;
      padding: 0.7in;
    }

    h1,
    h2,
    h3,
    h4 {
      break-after: avoid;
      line-height: 1.15;
      page-break-after: avoid;
    }

    h1 {
      border-bottom: 2px solid #111827;
      font-size: 2rem;
      padding-bottom: 0.35rem;
    }

    h2 {
      border-bottom: 1px solid #9ca3af;
      font-size: 1.4rem;
      margin-top: 2rem;
      padding-bottom: 0.2rem;
    }

    h3 {
      font-size: 1.1rem;
      margin-top: 1.4rem;
    }

    table {
      border-collapse: collapse;
      font-size: 0.92rem;
      margin: 1rem 0;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #9ca3af;
      padding: 0.35rem 0.45rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #e5e7eb;
    }

    pre {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      overflow-wrap: anywhere;
      padding: 0.65rem;
      white-space: pre-wrap;
    }

    code {
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 0.9em;
    }

    blockquote {
      border-left: 4px solid #6b7280;
      margin-left: 0;
      padding-left: 1rem;
    }

    a {
      color: #1d4ed8;
    }

    .status {
      color: #4b5563;
      font-style: italic;
    }

    @media print {
      @page {
        margin: 0.55in;
      }

      body {
        background: #ffffff;
        color: #000000;
        font-size: 10.5pt;
      }

      .toolbar,
      .status {
        display: none;
      }

      main {
        margin: 0;
        max-width: none;
        padding: 0;
      }

      h1 {
        font-size: 18pt;
      }

      h2 {
        font-size: 14pt;
        page-break-before: auto;
      }

      h3 {
        font-size: 11.5pt;
      }

      table,
      pre,
      blockquote {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <strong>GH-300 clean print view</strong>
    <span>
      <button type="button" onclick="window.print()">Print clean copy</button>
      <a href="https://github.com/albert6831/learn/blob/main/certifcations/GH-300/GH-300-study-notes.md">View Markdown</a>
    </span>
  </header>
  <main id="notes">
    <p class="status">Loading study notes...</p>
  </main>
  <script>
    const sourceUrl = "https://raw.githubusercontent.com/albert6831/learn/main/certifcations/GH-300/GH-300-study-notes.md";
    const notes = document.getElementById("notes");

    fetch(sourceUrl)
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Could not load study notes (${response.status}).`);
        }
        return response.text();
      })
      .then((markdown) => {
        notes.innerHTML = marked.parse(markdown);
        document.title = "GH-300 Unified Deep Dive";
      })
      .catch((error) => {
        notes.innerHTML = `<h1>Unable to load the study notes</h1><p>${error.message}</p><p>Download the Markdown file and serve this page from a local web server.</p>`;
      });
  </script>
</body>
</html>
